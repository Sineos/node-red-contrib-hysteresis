<script type="text/javascript">
    RED.nodes.registerType('hysteresis', {
        category: 'function',
        color: '#E2D96E',
        defaults: {
            name: { value: '' },
            ThresholdType: { value: 'fixed' },
            ThresholdRisingType: { value: 'num' },
            ThresholdRising: { value: '' },
            ThresholdFallingType: { value: 'num' },
            ThresholdFalling: { value: '' },
            TopicThreshold: { value: '' },
            TopicCurrent: { value: '' },
            ThresholdDeltaRising: { value: '' },
            ThresholdDeltaFalling: { value: '' },
            InitialMessage: { value: true },
            DynRaiseError: { value: false },
            OutRisingType: { value: 'msg' },
            OutRisingValue: { value: 'payload' },
            OutFallingType: { value: 'msg' },
            OutFallingValue: { value: 'payload' },
            OutTopicType: { value: 'msg' },
            OutTopicValue: { value: 'topic' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'hysteresis.png',
        label: function () {
            return this.name || 'hysteresis';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            const node = this;

            // --- Constants ---
            const thresholdTypes = ['num', 'jsonata', 'flow', 'global', 'env'];
            const outputPayloadTypes = [
                { value: 'msg', label: 'msg.payload', hasValue: false },
                'flow', 'global', 'str', 'num', 'bool', 'json', 'jsonata', 'date', 'env'
            ];
            const outputTopicTypes = [
                { value: 'msg', label: 'msg.topic', hasValue: false },
                'flow', 'global', 'str', 'jsonata', 'env'
            ];

            // --- Toggle UI for fixed/dynamic thresholds ---
            function toggleThresholdMode() {
                const mode = $('#node-input-ThresholdType').val();
                $('.form-row-ThresholdTypeFixed').toggle(mode === 'fixed');
                $('.form-row-ThresholdTypeDynamic').toggle(mode === 'dynamic');
            }

            // --- Live validation for dynamic hysteresis values ---
            function validateDynamicDeltas() {
                $('#node-input-ThresholdDeltaRising, #node-input-ThresholdDeltaFalling').each(function () {
                    const val = parseFloat($(this).val());
                    const isValid = !isNaN(val) && val >= 0;
                    $(this).css('border-color', isValid || $(this).val().trim() === '' ? '' : 'red');
                });
            }

            // --- Setup Typed Inputs ---
            $('#node-input-ThresholdRising').typedInput({
                default: 'num',
                typeField: $('#node-input-ThresholdRisingType'),
                types: thresholdTypes
            });

            $('#node-input-ThresholdFalling').typedInput({
                default: 'num',
                typeField: $('#node-input-ThresholdFallingType'),
                types: thresholdTypes
            });

            $('#node-input-OutRisingValue').typedInput({
                default: 'msg',
                typeField: $('#node-input-OutRisingType'),
                types: outputPayloadTypes
            });

            $('#node-input-OutFallingValue').typedInput({
                default: 'msg',
                typeField: $('#node-input-OutFallingType'),
                types: outputPayloadTypes
            });

            $('#node-input-OutTopicValue').typedInput({
                default: 'msg',
                typeField: $('#node-input-OutTopicType'),
                types: outputTopicTypes
            });

            // --- Event Bindings ---
            $('#node-input-ThresholdType').on('change', toggleThresholdMode);
            $('#node-input-ThresholdDeltaRising, #node-input-ThresholdDeltaFalling').on('input change', validateDynamicDeltas);

            // --- Initial UI State ---
            toggleThresholdMode();
            validateDynamicDeltas();

            // --- Restore typed input types from node state ---
            $('#node-input-ThresholdRising').typedInput('type', node.ThresholdRisingType || 'num');
            $('#node-input-ThresholdFalling').typedInput('type', node.ThresholdFallingType || 'num');
            $('#node-input-OutRisingValue').typedInput('type', node.OutRisingType || 'msg');
            $('#node-input-OutFallingValue').typedInput('type', node.OutFallingType || 'msg');
            $('#node-input-OutTopicValue').typedInput('type', node.OutTopicType || 'msg');
        }
    });
</script>

<script type="text/x-red" data-help-name="hysteresis">
    <p>Provides a hysteresis or deadband function to prevent rapid output changes based on fluctuating input values.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number</span></dt>
        <dd>The numeric value to check against the thresholds. Non-numeric payloads are ignored.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>In <b>Dynamic Mode</b>, the topic distinguishes between <code>Threshold Topic</code> (used to set the center point) and <code>Input Value Topic</code> (used to provide the value to check).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload</dt>
        <dd>The output payload sent only when a threshold crossing causes a state change (Low -> High or High -> Low, including from Deadband). Can be configured using a TypedInput supporting msg properties, flow/global context, JSONata, strings, numbers, booleans, JSON, environment variables, etc.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>The output topic. Can be configured using a TypedInput supporting msg properties (like original topic), flow/global context, JSONata, strings, environment variables, etc.</dd>
        <dt>hystdirection <span class="property-type">string</span></dt>
        <dd>Added to the output message. Indicates why the output was triggered: <code>"initial high"</code>, <code>"initial low"</code> (only if "Send Output on Initial State" is checked), <code>"rising"</code> (state changed Low/Deadband -> High), or <code>"falling"</code> (state changed High/Deadband -> Low).</dd>
    </dl>

    <h3>Details</h3>
    <p>This node implements hysteresis logic. After initialization or deployment, it determines its internal state (High, Low, or Deadband) based on the first valid numeric input received, comparing it to the configured thresholds (which are evaluated at runtime if necessary).</p>
    <p>Subsequently, it only sends an output message when the input value crosses a threshold that results in a change of state:</p>
     <ul>
        <li>If the current state is <b>Low</b> or <b>Deadband</b> and the input meets or exceeds the evaluated <b>Upper Threshold</b>, the node sends a message (<code>hystdirection: "rising"</code>) and switches its internal state to <b>High</b>.</li>
        <li>If the current state is <b>High</b> or <b>Deadband</b> and the input meets or falls below the evaluated <b>Lower Threshold</b>, the node sends a message (<code>hystdirection: "falling"</code>) and switches its internal state to <b>Low</b>.</li>
        <li>If the input remains within the dead band, or moves further away from the dead band without changing state, no message is sent, but the node's visual status is updated.</li>
    </ul>


    <h4>Mode: Fixed vs Dynamic Thresholds</h4>

    <h5>Fixed Thresholds</h5>
    <p>The Upper and Lower thresholds are evaluated on each input message based on the configured type and value.</p>
    <ul>
        <li><b>Upper Threshold:</b> Define the rising threshold using a TypedInput (supports Number, JSONata, Flow/Global context, Environment variables, etc.).</li>
        <li><b>Lower Threshold:</b> Define the falling threshold using a TypedInput.</li>
        <li><i>Constraint:</i> For the node to be active, the evaluated Upper Threshold value must be numeric and strictly greater than the evaluated Lower Threshold value (which must also be numeric). Errors during evaluation or an invalid order will prevent output.</li>
    </ul>

    <h5>Dynamic Thresholds (via msg)</h5>
    <p>Thresholds are calculated based on messages received on specific topics:</p>
     <ul>
        <li><b>Threshold Topic:</b> The required topic of messages whose <code>msg.payload</code> (number) sets the <i>center point</i> for the dynamic thresholds.</li>
        <li><b>Hysteresis (+):</b> A non-negative number added to the center point to compute the Upper Threshold.</li>
        <li><b>Hysteresis (-):</b> A non-negative number subtracted from the center point to compute the Lower Threshold.</li>
        <li><b>Input Value Topic:</b> The required topic of messages whose <code>msg.payload</code> (number) provides the value to be evaluated against the thresholds.</li>
        <li><b>Error if Threshold Missing:</b> If checked, an error is raised if an input value arrives on the <code>Input Value Topic</code> before valid dynamic thresholds have been established via the <code>Threshold Topic</code>. If unchecked, the message is ignored with a warning.</li>
        <li><b>Note:</b> Dynamic thresholds are <i>not persisted</i> across Node-RED deploys or restarts and must be reset by sending a message to the <code>Threshold Topic</code>.</li>
    </ul>


    <h4>Output Settings</h4>
    <ul>
        <li><b>Send Output on Initial State:</b> Controls only whether an output message is sent if the <i>very first</i> valid input value after deployment is already outside the deadband. The node's internal state (High, Low, or Deadband) is determined and tracked correctly based on the first input <i>regardless</i> of this setting.</li>
        <li><b>Output Payload (Rising/Falling):</b> Use the TypedInput to configure the <code>msg.payload</code> for outputs triggered by rising or falling transitions. Supports selecting original `msg.payload`, flow/global context, JSONata, fixed String/Number/Boolean/JSON, Timestamp, Environment Variables, etc.</li>
        <li><b>Output Topic:</b> Use the TypedInput to configure the <code>msg.topic</code> for output messages. Supports selecting original `msg.topic`, flow/global context, JSONata, fixed String, Environment Variables, etc.</li>
    </ul>

     <h4>Status Monitoring</h4>
    <p>The node's visual status provides detailed real-time feedback. Examples:</p>
    <ul>
        <li><code>Error: Invalid Thresholds</code> / <code>Error: Thresholds missing</code></li>
        <li><code>waiting for threshold topic</code> / <code>waiting for input</code></li>
        <li><code>R:22 F:18 Val:20 (Initial Deadband)</code></li>
        <li><code>R:22 F:18 Val:25 (high band rising)</code> / <code>R:22 F:18 Val:15 (low band falling)</code></li>
        <li><code>R:22 F:18 Val:20 (high dead band falling)</code> / <code>R:22 F:18 Val:19 (low dead band rising)</code></li>
        <li><code>R:22 F:18 Val:24 (high band)</code> (*after output*) / <code>R:22 F:18 Val:16 (low band)</code> (*after output*)</li>
    </ul>
    <p>Use the standard Node-RED <code>Status</code> node to monitor this Hysteresis node and trigger flows based on specific status conditions.</p>


    <h4>Use Cases</h4>
    <ul>
        <li><b>Thermostat:</b> Turn heating on below flow.temp_low, off above flow.temp_high.</li>
        <li><b>Tank Level Control:</b> Use dynamic thresholds based on a target level message.</li>
        <li><b>Adaptive Control:</b> Adjust thresholds using JSONata based on other message properties or context.</li>
    </ul>
</script>
